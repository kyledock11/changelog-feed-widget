<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #191919;
    color: #e8e4df;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    min-height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
  }

  ::-webkit-scrollbar {
    width: 3px;
  }

  ::-webkit-scrollbar-track {
    background: #191919;
  }

  ::-webkit-scrollbar-thumb {
    background: #2a2725;
    border-radius: 2px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: #3a3530;
  }

  * {
    scrollbar-width: thin;
    scrollbar-color: #2a2725 #191919;
  }

  .container {
    max-width: 640px;
    width: 100%;
    padding: 1.25rem 1.5rem;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 8px;
  }

  .label {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #a09a92;
    margin-bottom: 1.75rem;
  }

  .feed {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .entry {
    padding: 1.25rem 0;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .entry.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .entry-repo {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #958f88;
    margin-bottom: 0.4rem;
  }

  .entry-message {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.1rem;
    line-height: 1.55;
    color: #f2efea;
    margin-bottom: 0.45rem;
  }

  .entry-type {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #7a756e;
    display: inline-block;
    margin-right: 0.5rem;
  }

  .entry-time {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.75rem;
    color: #8a857e;
  }

  .entry-divider {
    width: 24px;
    height: 1px;
    background: #2a2725;
    margin: 0;
  }

  .empty-state {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.85rem;
    color: #8a857e;
    padding: 1.25rem 0;
  }

  .loading-state {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.75rem;
    color: #6b6660;
    letter-spacing: 0.1em;
    padding: 1.25rem 0;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="container">
  <div class="label">Build Log</div>
  <div class="feed" id="feed">
    <div class="loading-state">Fetching activity&hellip;</div>
  </div>
</div>

<script>
const GITHUB_USER = 'kyledock11';
const MAX_ENTRIES = 5;
const REFRESH_INTERVAL = 600000; // 10 minutes

function relativeTime(dateStr) {
  const then = new Date(dateStr);
  const now = new Date();
  const diffMs = now - then;
  const diffSec = Math.floor(diffMs / 1000);
  const diffMin = Math.floor(diffSec / 60);
  const diffHr = Math.floor(diffMin / 60);
  const diffDay = Math.floor(diffHr / 24);

  if (diffSec < 60) return 'just now';
  if (diffMin < 60) return diffMin === 1 ? '1 minute ago' : `${diffMin} minutes ago`;
  if (diffHr < 24) return diffHr === 1 ? '1 hour ago' : `${diffHr} hours ago`;
  if (diffDay === 1) return 'yesterday';
  if (diffDay < 7) return `${diffDay} days ago`;
  if (diffDay < 14) return '1 week ago';
  return `${Math.floor(diffDay / 7)} weeks ago`;
}

function stripRepoOwner(fullName) {
  const parts = fullName.split('/');
  return parts[parts.length - 1];
}

function truncate(str, maxLen) {
  if (!str) return '';
  str = str.split('\n')[0].trim();
  if (str.length <= maxLen) return str;
  return str.slice(0, maxLen).trimEnd() + '…';
}

function eventToEntry(event) {
  const repo = stripRepoOwner(event.repo.name);
  const time = relativeTime(event.created_at);

  switch (event.type) {
    case 'PushEvent': {
      if (!event.payload || !event.payload.commits) return null;
      const commits = event.payload.commits;
      const last = commits[commits.length - 1];
      if (!last || !last.message) return null;
      const count = commits.length;
      const suffix = count > 1 ? ` (+${count - 1} more)` : '';
      return { repo, message: truncate(last.message, 120) + suffix, time, type: 'pushed' };
    }
    case 'CreateEvent': {
      const ref = event.payload.ref_type;
      const name = event.payload.ref;
      if (ref === 'repository') {
        return { repo, message: `Created repository`, time, type: 'created' };
      }
      return { repo, message: `Created ${ref} ${name || ''}`.trim(), time, type: 'created' };
    }
    case 'DeleteEvent': {
      const ref = event.payload.ref_type;
      const name = event.payload.ref;
      return { repo, message: `Deleted ${ref} ${name || ''}`.trim(), time, type: 'deleted' };
    }
    case 'ReleaseEvent': {
      const tag = event.payload.release?.tag_name || '';
      return { repo, message: `Released ${tag}`, time, type: 'released' };
    }
    case 'IssuesEvent': {
      const action = event.payload.action;
      const title = truncate(event.payload.issue?.title || '', 100);
      return { repo, message: `${action} issue: ${title}`, time, type: 'issue' };
    }
    case 'PullRequestEvent': {
      const action = event.payload.action;
      const title = truncate(event.payload.pull_request?.title || '', 100);
      return { repo, message: `${action} PR: ${title}`, time, type: 'pr' };
    }
    case 'ForkEvent': {
      return { repo, message: `Forked repository`, time, type: 'forked' };
    }
    case 'WatchEvent': {
      return { repo, message: `Starred repository`, time, type: 'starred' };
    }
    default:
      return null;
  }
}

async function fetchActivity() {
  const url = `https://api.github.com/users/${GITHUB_USER}/events/public`;
  const res = await fetch(url, {
    headers: { 'Accept': 'application/vnd.github.v3+json' }
  });
  if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
  const events = await res.json();

  const entries = [];

  for (const event of events) {
    const entry = eventToEntry(event);
    if (!entry) continue;
    entries.push(entry);
    if (entries.length >= MAX_ENTRIES) break;
  }

  return entries;
}

function renderEntries(entries) {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';

  if (entries.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'No recent activity.';
    feed.appendChild(empty);
    return;
  }

  entries.forEach((entry, i) => {
    const el = document.createElement('div');
    el.className = 'entry';
    el.innerHTML = `
      <div class="entry-repo">${escHtml(entry.repo)}</div>
      <div class="entry-message">${escHtml(entry.message)}</div>
      <div class="entry-time"><span class="entry-type">${escHtml(entry.type)}</span>${escHtml(entry.time)}</div>
    `;
    feed.appendChild(el);

    // Staggered fade-in
    setTimeout(() => el.classList.add('visible'), i * 80);

    if (i < entries.length - 1) {
      const divider = document.createElement('div');
      divider.className = 'entry-divider';
      feed.appendChild(divider);
    }
  });
}

function escHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

async function refresh() {
  try {
    const entries = await fetchActivity();
    renderEntries(entries);
  } catch (err) {
    const feed = document.getElementById('feed');
    feed.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'No recent activity.';
    feed.appendChild(empty);
  }
}

refresh();
setInterval(refresh, REFRESH_INTERVAL);
</script>
</body>
</html>
